<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduSphere – CBSE Learning Platform</title>
  <meta name="description" content="Complete NCERT study platform for CBSE students in Classes 8, 9 and 10. Syllabus, quizzes, flashcards, homework tracker and more.">
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js for progress charts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
</head>
<body>

<!-- Sidebar Overlay (mobile) -->
<div id="sidebar-overlay" class="hidden"></div>

<!-- App Layout -->
<div id="app-layout">

  <!-- Sidebar (built by JS) -->
  <aside id="sidebar"></aside>

  <!-- Main Content -->
  <div id="main-content">

    <!-- Top Header -->
    <header id="top-header">
      <button id="hamburger-btn" aria-label="Toggle menu">☰</button>
      <div id="page-title">Dashboard</div>
      <div class="header-actions">
        <div class="streak-badge">🔥 <span>0 day streak</span></div>
        <button class="btn-icon" id="theme-toggle" title="Toggle theme">🌙</button>
      </div>
    </header>

    <!-- Page Content (rendered by JS) -->
    <main id="page-content"></main>

  </div>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<script src="script.js"></script>
</body>
</html>
